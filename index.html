<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iterlay</title>
    <script>
      const bootTheme = new URLSearchParams(location.search).get("bootTheme");
      if (bootTheme === "dark" || bootTheme === "light") document.documentElement.classList.add(`boot-${bootTheme}`);
      const storedLanguage = localStorage.getItem("iterlay:language");
      const systemIsChinese = navigator.languages.some((language) => language.toLowerCase().startsWith("zh"));
      const locale = storedLanguage === "zh-CN" || storedLanguage === "en-US"
        ? storedLanguage
        : systemIsChinese ? "zh-CN" : "en-US";
      document.documentElement.lang = locale;
    </script>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      html, body, #root { min-height: 100%; }
      body { margin: 0; overflow: hidden; background: #fafafa; color: #171717; }
      * { box-sizing: border-box; }
      .boot { display: flex; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; gap: 20px; isolation: isolate; -webkit-app-region: drag; }
      .boot-mark { position: relative; width: 96px; height: 86px; contain: layout paint style; }
      .boot-mark svg, .boot-layer { position: absolute; inset: 0; width: 100%; height: 100%; }
      .boot-layer { display: block; opacity: 0; transform-origin: center; backface-visibility: hidden; will-change: transform, opacity; animation: boot-layer-settle 1.5s cubic-bezier(.22, 1, .36, 1) infinite both; }
      .boot-shadow { fill: rgb(35 55 106 / 10%); }
      .boot-top { --fx: 15px; --fy: -16px; --tx: -4px; --ty: 4px; }
      .boot-middle { --fx: 20px; --fy: 2px; --tx: -5px; --ty: -1px; animation-delay: .08s; }
      .boot-bottom { --fx: -16px; --fy: 15px; --tx: 4px; --ty: -4px; animation-delay: .16s; }
      .boot-face { fill: #2f61e8; stroke: rgb(39 79 176 / 32%); stroke-width: .75; }
      .boot-edge { fill: #16368f; }
      .boot strong { font-size: 18px; font-weight: 600; line-height: 1; }
      .boot-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
      .boot-error { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 32px; color: #a11; font-size: 14px; text-align: center; }
      @keyframes boot-layer-settle {
        0% { opacity: 0; transform: translate3d(var(--fx), var(--fy), 0) scale(.94); }
        24%, 70% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        86%, 100% { opacity: 0; transform: translate3d(var(--tx), var(--ty), 0) scale(.985); }
      }
      .boot-dark body { background: #21242c; color: #edf0f3; } .boot-dark .boot-shadow { fill: rgb(0 0 0 / 25%); } .boot-dark .boot-error { color: #ffaaa2; }
      @media (prefers-color-scheme: dark) { html:not(.boot-dark):not(.boot-light) body { background: #21242c; color: #edf0f3; } html:not(.boot-dark):not(.boot-light) .boot-shadow { fill: rgb(0 0 0 / 25%); } html:not(.boot-dark):not(.boot-light) .boot-error { color: #ffaaa2; } }
      @media (prefers-reduced-motion: reduce) { .boot-layer { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-mark" role="img" aria-label="Iterlay">
          <svg class="boot-shadow" viewBox="0 0 120 108" aria-hidden="true"><ellipse cx="56" cy="101" rx="30" ry="3.5" /></svg>
          <span class="boot-layer boot-top"><svg viewBox="0 0 120 108" aria-hidden="true"><path class="boot-edge" d="M56 8h50L86 32H36L56 8Z"/><path class="boot-face" d="M56 4h50L86 28H36L56 4Z"/></svg></span>
          <span class="boot-layer boot-middle"><svg viewBox="0 0 120 108" aria-hidden="true"><path class="boot-edge" d="M36 42h50L66 66H16l20-24Z"/><path class="boot-face" d="M36 38h50L66 62H16l20-24Z"/></svg></span>
          <span class="boot-layer boot-bottom"><svg viewBox="0 0 120 108" aria-hidden="true"><path class="boot-edge" d="M16 76h50l-20 24H0l16-19.2V76Z"/><path class="boot-face" d="M16 72h50L46 96H0l16-19.2V72Z"/></svg></span>
        </div>
        <strong>Iterlay</strong>
        <span class="boot-sr" id="boot-status">正在打开 Iterlay</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>if (document.documentElement.lang === "en-US") document.getElementById("boot-status").textContent = "Opening Iterlay";</script>
  </body>
</html>
