name: Build desktop release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: mac, arch: arm64 }
          - { os: macos-14, platform: mac, arch: x64 }
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: windows-latest, platform: win, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:subprojects
      - run: bash scripts/release.sh --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            output/package-size/*.json
